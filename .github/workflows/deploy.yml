# CI/CD required by the brief: lint and unit tests -> build + browser tests -> deploy to GitHub Pages.
name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; only the deploy job gets write access to Pages.
permissions:
  contents: read

# A newer push cancels an older run of the same branch; pull requests never cancel a run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check that the API address is set
        run: test -n "$VITE_API_URL" || { echo "::error::Repository variable VITE_API_URL is empty"; exit 1; }
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - run: npm run build
        env:
          # Public Worker URL, set in Settings > Secrets and variables > Actions > Variables.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  e2e:
    # Browser tests (Playwright: Chromium, Firefox, WebKit) on a production build with the API mocked.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    needs: [build, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Deployments queue instead of cancelling each other.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke test of the live app and API
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          API_URL: ${{ vars.VITE_API_URL }}
        run: |
          curl -fsS -o /dev/null "$PAGE_URL"
          status=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: https://rafalmisiorski.github.io' -H 'Access-Control-Request-Method: POST' "$API_URL/analyze")
          echo "API preflight from the Pages origin: $status"
          test "$status" = "204"
