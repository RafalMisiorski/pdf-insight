# Cloudflare Worker: the API proxy between the GitHub Pages app and the LLM.
# The LLM key is NOT in this file: production uses `npx wrangler secret put GEMINI_API_KEY`,
# local development reads it from .dev.vars (git-ignored).
name = "pdf-insight-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Publish on https://pdf-insight-api.<account-subdomain>.workers.dev (no custom domain needed)
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://rafalmisiorski.github.io"
MODEL = "gemini-3.8-flash"
MAX_TEXT_CHARS = "400000"
# Analyses per UTC day for the whole demo: keeps the prepaid model budget for the review period.
DAILY_LIMIT = "50"

# Exact rate limits (10 per minute per IP, DAILY_LIMIT per day): one Durable Object per key.
# Durable Objects on the Free plan must use the SQLite storage backend.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]
